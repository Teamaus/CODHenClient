<details [open]="stock.open" (toggle)="toggle($event)" #details>
<summary class="stock-card-summary" [class.selected]="stock.selected">
  <stock-symbol [symbol]="stock.symbol" [selected]="stock.selected"></stock-symbol>	
</summary>
<span>
<div class="stock-card" (click)="collapse()" #body [class.selected]="stock.selected" >
  <span>
      <input type="checkbox" [checked]="stock.selected" (click)="toggleSelect($event)"/>
      <stock-symbol [symbol]="stock.symbol"></stock-symbol>
  </span>
  <codcoda-collapse-expand></codcoda-collapse-expand>
  <div class="stock-row">
    <span class="stock-field"><stock-field label="Entry:" [value]="stock.entry" [change]="'positive'"></stock-field></span>
    <span class="stock-field">Stop loss: {{stock.stop_loss}}</span>
    <span class="stock-field">Target: {{stock.target}}</span>
    <span class="stock-field">RR: {{stock.rr}}</span>
  </div>
  <div class="buttons-row">
      <codcoda-button style="grid-row:1;grid-column:2" >Trading-View</codcoda-button>
  </div>
</div>
</span>
</details>
