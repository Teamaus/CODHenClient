
<span class="label">{{attribute}}
</span>
<span class="icon">
	<svg (click)="State('asc')" width="15" height="15" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
		<path [ngClass]="selected_state['asc']" d="M12 20V6"   stroke-linecap="round"/>
		<path class="arrow" d="M6 12L12 6L18 12" [ngClass]="selected_state['asc']" stroke-linecap="round" stroke-linejoin="round"/>
	</svg>
	<svg (click)="State('desc')" width="15" height="15" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
	<path [ngClass]="selected_state['desc']" d="M12 4V18" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
	<path [ngClass]="selected_state['desc']" d="M6 12L12 18L18 12" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
	</svg>
<svg width="20" height="10" viewBox="0 0 80 40" xmlns="http://www.w3.org/2000/svg">
  <g fill="#1f8f7a">
    <rect x="40" y="6" width="28" height="6" rx="3"/>
    <rect x="40" y="17" width="22" height="6" rx="3"/>
    <rect x="40" y="28" width="16" height="6" rx="3"/>
  </g>
</svg></span>
