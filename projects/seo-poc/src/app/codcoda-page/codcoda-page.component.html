<div class="scanner-content">
  <div class="page-controls">
    <codcoda-ids
      [ids]="ids"
      (idChanged)="idChanged($event)">
    </codcoda-ids>
  </div>

  <codcoda-stock-card-list
    *ngFor="let pattern of patterns()"
    [pattern]="pattern"
    (selected)="selectPattern(pattern)"
    [sectors]="getSectors()">
  </codcoda-stock-card-list>

</div>
